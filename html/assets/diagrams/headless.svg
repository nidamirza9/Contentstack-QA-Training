<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="t">
  <title id="t">Old CMS vs headless CMS</title>
  <rect width="920" height="280" fill="#fffdf8"/>
  <rect x="24" y="36" width="400" height="212" rx="12" fill="#ece6da" stroke="#d8d0c2"/>
  <text x="224" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c1914">Old (coupled) CMS</text>
  <rect x="64" y="88" width="320" height="56" rx="8" fill="#12262c"/>
  <text x="224" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fff">Content + website together</text>
  <text x="224" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c564c">Preview in CMS H the live page</text>
  <text x="224" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c564c">One site only</text>
  <rect x="496" y="36" width="400" height="212" rx="12" fill="#e7eef0" stroke="#0f4c5c"/>
  <text x="696" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#0f4c5c">Headless (Contentstack)</text>
  <rect x="536" y="88" width="140" height="48" rx="8" fill="#0f4c5c"/>
  <text x="606" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">CMS stores</text>
  <text x="696" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#0f4c5c">’</text>
  <rect x="716" y="88" width="140" height="48" rx="8" fill="#12262c"/>
  <text x="786" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fff">JSON / API</text>
  <text x="696" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c1914">Website, app, kiosk each fetch JSON</text>
  <text x="696" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c564c">CMS screen ` live site until you prove it</text>
</svg>
