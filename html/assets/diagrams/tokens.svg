<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img">
  <rect width="920" height="240" fill="#fffdf8"/>
  <rect x="20" y="40" width="280" height="168" rx="12" fill="#1f5c3a"/>
  <text x="160" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">Delivery token</text>
  <text x="160" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#e8f3f5">What the live site uses</text>
  <text x="160" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#e8f3f5">Published content only</text>
  <text x="160" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#cfe8d8">One token per environment</text>
  <rect x="320" y="40" width="280" height="168" rx="12" fill="#8a4b12"/>
  <text x="460" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">Preview token</text>
  <text x="460" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#f7eee4">Shows drafts</text>
  <text x="460" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#f7eee4">Live Preview / Timeline</text>
  <text x="460" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#f7eee4">Keep this secret</text>
  <rect x="620" y="40" width="280" height="168" rx="12" fill="#6b1d1d"/>
  <text x="760" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#fff">Management token</text>
  <text x="760" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fde8e8">Create / edit / release</text>
  <text x="760" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#fde8e8">Never in the browser</text>
  <text x="760" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#fde8e8">Does not prove the shopper site</text>
</svg>
